role: "tester"
class: "operational"
authority_level: 2
version: "1.0.0"
contract: |
  Write and run tests for the implemented feature. Ensure all tests pass.
capabilities_required:
  - "shell"
  - "fs_write"
token_defaults:
  ttl: "2h"
  max_revisions: 2
  budget_usd: 1.00
behavioral_tests:
  required: true
  runner: "playwright"
  pattern: "e2e/story-{story_id}.spec.ts"
  log_pattern: "\\d+ passed, 0 failed"
  gate: "TESTING_LOOP_CLOSE"
  record_by_agent: true
fixed_sections:
  - "role"
  - "class"
  - "authority_level"
human_sections:
  - "contract"
