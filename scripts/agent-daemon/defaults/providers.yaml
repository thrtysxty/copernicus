providers:
  mlx-native:
    type: local
    baseURL: http://localhost:8080/v1
    auth: none
    cost_tier: zero
    liveness_path: /v1/models
    timeout_ms: 1500

  local-ollama:
    type: local
    baseURL: http://localhost:11434/v1
    auth: env:OLLAMA_API_KEY
    cost_tier: zero
    liveness_path: /v1/models
    timeout_ms: 1500

  cloud-ollama:
    type: cloud
    baseURL: https://ollama.com/api
    auth: env:OLLAMA_API_KEY
    cost_tier: paid_low

  ccr:
    type: proxy
    baseURL: http://127.0.0.1:9669
    auth: none
    cost_tier: free
    liveness_path: /v1/models
    timeout_ms: 1500

  openrouter:
    type: cloud
    baseURL: https://openrouter.ai/api/v1
    auth: env:OPENROUTER_API_KEY
    cost_tier: paid

  anthropic:
    type: cloud
    baseURL: https://api.anthropic.com/v1
    auth: env:ANTHROPIC_API_KEY
    cost_tier: paid_high

models:
  gemma4:e4b:
