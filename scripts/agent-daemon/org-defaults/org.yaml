version: 1
roles:
  planner:
    class: operational
    authority_level: 2
    assigned_to:
      provider: openai
      model: o3-mini
    token_ttl: "1h"
    token_budget_usd: 1.0
    token_max_revisions: 2
  coder:
    class: operational
    authority_level: 1
    assigned_to:
      provider: jules
      model: jules
    token_ttl: "2h"
    token_budget_usd: 2.0
    token_max_revisions: 5
  reviewer:
    class: regulatory
    authority_level: 4
    assigned_to:
      provider: anthropic
      model: claude-3-7-sonnet-20250219
    token_ttl: "30m"
    token_budget_usd: 0.5
    token_max_revisions: 1
  sentinel:
    class: regulatory
    authority_level: 5
    assigned_to:
      provider: anthropic
      model: claude-3-7-sonnet-20250219
    token_ttl: "30m"
    token_budget_usd: 1.0
    token_max_revisions: 1
authority_chains:
  regulatory_overrides_operational: true
  reviewer_can_block: ["coder", "planner"]
  sentinel_can_block: ["coder", "planner", "reviewer"]
enforcement:
  block_mode: hard
  wait_timeout_plan: "30m"
  wait_timeout_human: "2h"
  require_token_for_dispatch: true
