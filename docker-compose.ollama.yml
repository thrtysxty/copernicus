version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: copernicus-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama   # persist models across container restarts
    environment:
      - OLLAMA_HOST=127.0.0.1           # bind to localhost only
      - OLLAMA_NUM_PARALLEL=2         # allow 2 concurrent requests (embed + chat)
      - OLLAMA_MAX_LOADED_MODELS=2    # keep nomic-embed-text + one chat model hot
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 4G                 # Optimized for 1.5B-3B models on 8GB host

volumes:
  ollama_models:
