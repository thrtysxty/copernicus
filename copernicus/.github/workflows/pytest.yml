name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run test suite (coverage)
        run: python -m pytest backend/tests/ --cov=backend --cov-report=term-missing --cov-fail-under=60

      - name: Security gate (FAILED=0)
        run: |
          python -m pytest \
            backend/tests/test_docs_path_security.py \
            backend/tests/test_stories_security.py \
            backend/tests/test_context_manager_pruning.py \
            -v --tb=short
