directories:
  output: release/${version}
  buildResources: build
appId: com.copernicus.copernicus
productName: COPERNICUS IDE
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
publish:
  provider: github
  owner: copernicus-ide
  repo: copernicus
electronVersion: 28.3.3
