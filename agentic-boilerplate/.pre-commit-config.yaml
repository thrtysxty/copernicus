# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-merge-conflict

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format

-   repo: local
    hooks:
    -   id: block-misplaced-stories
        name: Block Misplaced Story Files
        entry: story_.*\.md
        language: pygrep
        files: ^story_.*\.md$
        exclude: ^docs/stories/
    -   id: block-destructive-commands
        name: Block Destructive Commands
        entry: 'rm -rf|shutil\.rmtree' # nosec
        language: pygrep
        types: [python, markdown]
        exclude: .*\.pre-commit-config.yaml
    -   id: pi-constraint-audit
        name: Raspberry Pi Constraint Audit
        entry: python scripts/utils/pi_audit.py
        language: python
        types: [python]
